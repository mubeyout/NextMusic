<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NextMusic 车机版 v8.1 · 1:1 高保真 Demo</title>
<style>
:root{--bg:#0e0e0f;--surface:#151516;--surface2:#1d1d1f;--border:#26262a;--text:#ffffff;--text2:#b3b3b8;--text3:#77777d;--brand:#1ed760;--on:#000;--track:#2c2c30}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:#000;overflow:hidden;font-family:-apple-system,'PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',sans-serif;color:var(--text)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;background:var(--bg);position:relative;overflow:hidden;border-radius:10px;box-shadow:0 0 80px rgba(0,0,0,.9);flex:none}
/* ===== 顶 tab 条 52dp ===== */
#topbar{height:52px;display:flex;align-items:center;gap:8px;padding:0 33px;background:var(--bg);border-bottom:1px solid var(--border)}
.brand{font-size:19px;font-weight:800;margin-right:14px;letter-spacing:.2px}
.brand em{font-style:normal;color:var(--brand)}
.tabs{display:flex;flex:1}
.tab{height:52px;padding:0 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:17px;font-weight:600;color:var(--text2)}
.tab.on{color:var(--text);font-weight:800}
.tab .u{width:20px;height:3px;border-radius:2px;background:var(--brand);margin-top:4px;visibility:hidden}
.tab.on .u{visibility:visible}
.ibtn{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:17px}
.ibtn:hover{color:var(--text)}
/* ===== 主区 ===== */
#main{display:flex;height:668px}
/* 左播放面板 300dp 八件套 */
#panel{width:300px;background:var(--surface);border-right:1px solid var(--border);padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px}
#cover{width:260px;height:260px;border-radius:16px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;font-size:44px;color:rgba(255,255,255,.5)}
#pname{width:100%;font-size:18px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#partist{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;color:var(--text2);cursor:pointer;white-space:nowrap;overflow:hidden}
#partist svg{flex:none}
#partist span{overflow:hidden;text-overflow:ellipsis}
.prow{width:100%;height:4px;border-radius:2px;background:var(--track);display:flex;overflow:hidden;cursor:pointer}
.prow i{background:var(--brand);height:100%}
#times{width:100%;display:flex;justify-content:space-between;font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}
#ctrls{display:flex;align-items:center;gap:18px;margin-top:6px}
.cbtn{width:40px;height:40px;border-radius:20px;background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.cbtn:hover{color:var(--brand)}
#play{width:56px;height:56px;border-radius:28px;background:var(--brand);color:var(--on)}
#tools{display:flex;gap:12px;margin-top:8px}
.tool{width:36px;height:36px;border-radius:18px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);background:none}
.tool:hover,.tool.on{color:var(--brand);border-color:var(--brand)}
#badges{display:flex;gap:8px}
.badge{font-size:11px;color:var(--text3);background:var(--surface2);padding:3px 10px;border-radius:10px}
#qanchor{margin-top:auto;padding:8px 0 2px;font-size:12px;color:var(--text3);cursor:pointer}
#qanchor:hover{color:var(--text2)}
/* 内容区 */
#content{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:18px 33px 40px;display:none}
.page.on{display:block}
.page::-webkit-scrollbar{width:0}
.ptitle{font-size:22px;font-weight:800;margin-bottom:14px}
.sec{font-size:16px;font-weight:700;margin:18px 0 12px;color:var(--text)}
/* 5 列网格: 162.8 × 4×25 gap + 33 gutter = 980 精确自洽 */
.grid{display:grid;grid-template-columns:repeat(5,162.8px);gap:25px 25px}
.card{cursor:pointer}
.card .cv{width:162.8px;height:162.8px;border-radius:12px;position:relative;overflow:hidden}
.card .cv .sq{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:rgba(255,255,255,.55)}
.card .nm{font-size:13px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ar{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 榜单行 */
.board{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:14px;background:var(--surface);margin-bottom:12px;cursor:pointer}
.board:hover{background:var(--surface2)}
.board .no{width:34px;font-size:22px;font-weight:800;color:var(--brand);font-style:italic}
.board .t{flex:1}
.board .t b{font-size:16px;display:block}
.board .t span{font-size:12px;color:var(--text3)}
.board .heat{font-size:12px;color:var(--text3)}
/* 歌曲行 */
.srow{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:12px;cursor:pointer}
.srow:hover{background:var(--surface2)}
.srow .cv{width:52px;height:52px;border-radius:10px;flex:none;position:relative;overflow:hidden}
.srow .m{flex:1;min-width:0}
.srow .m b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .m span{font-size:12px;color:var(--text3)}
.srow .qi{font-size:11px;color:var(--brand);border:1px solid var(--brand);padding:1px 6px;border-radius:6px;margin-right:6px}
.srow .now{color:var(--brand);font-size:12px;margin-right:4px}
/* 乐库 provider 卡 */
.lib{display:flex;align-items:center;gap:16px;padding:16px;border-radius:14px;background:var(--surface);margin-bottom:12px;cursor:pointer}
.lib:hover{background:var(--surface2)}
.lib .ic{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px}
.lib b{display:block;font-size:16px}
.lib span{font-size:12px;color:var(--text3)}
.lib .chev{color:var(--text3)}
/* 搜索 */
#sq{width:100%;height:52px;border-radius:14px;background:var(--surface2);border:none;outline:none;color:var(--text);font-size:16px;padding:0 18px;margin-bottom:16px}
.hot{display:flex;flex-wrap:wrap;gap:10px}
.hot span{padding:8px 18px;border-radius:18px;background:var(--surface2);font-size:14px;color:var(--text2);cursor:pointer}
.hot span:hover{color:var(--text)}
/* 设置行 */
.set{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;background:var(--surface);margin-bottom:12px;cursor:pointer;font-size:15px}
.set:hover{background:var(--surface2)}
.set .k{flex:1}
.set .v{font-size:12px;color:var(--text3)}
/* ===== 覆盖层 ===== */
.ov{position:absolute;inset:0;background:rgba(8,8,9,.96);z-index:50;display:none;flex-direction:column}
.ov.on{display:flex}
.ovhead{height:64px;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--border)}
.ovhead .back{width:44px;height:44px;border-radius:22px;background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ovhead b{font-size:18px}
.ovbody{flex:1;overflow-y:auto;padding:18px 33px 40px}
/* CarPlayer 全屏 */
#player{position:absolute;inset:0;z-index:80;display:none}
#player.on{display:flex}
#pbg{position:absolute;inset:0;filter:blur(60px) brightness(.4);transform:scale(1.3)}
#pveil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.72))}
#pin{position:relative;flex:1;display:flex;align-items:center;padding:0 56px;gap:48px}
#pinfo{width:400px;display:flex;flex-direction:column;gap:12px}
#pt{font-size:30px;font-weight:800;line-height:1.25}
#pa{font-size:17px;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:8px}
#pchips{display:flex;gap:10px;margin-top:6px}
#pchips span{font-size:12px;border:1px solid var(--border);border-radius:14px;padding:5px 14px;color:var(--text2);cursor:pointer}
#pchips span:hover{color:var(--text);border-color:var(--text3)}
#pctrls{display:flex;align-items:center;gap:26px;margin-top:18px}
#pctrls .cbtn{width:64px;height:64px;border-radius:32px}
#pctrls #play{width:58px;height:58px;border-radius:29px}
#vinyl{width:359px;height:359px;flex:none;position:relative}
#vinyl .disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%,#111 0 30%,#0a0a0a 30% 100%);border:2px solid #1c1c1e;animation:spin 8s linear infinite;animation-play-state:paused}
#vinyl.spin .disc{animation-play-state:running}
#vinyl .lab{position:absolute;inset:26%;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center}
#vinyl .hole{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#000;box-shadow:0 0 0 3px #2a2a2c}
@keyframes spin{to{transform:rotate(360deg)}}
#pbar{position:absolute;left:56px;right:56px;bottom:34px}
#pback{position:absolute;left:24px;top:12px;z-index:5;width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;cursor:pointer}
/* toast */
#toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(30,30,32,.96);border:1px solid var(--border);color:var(--text);font-size:14px;padding:12px 26px;border-radius:22px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
.scale-note{position:fixed;right:14px;bottom:10px;color:#3c3c40;font-size:12px;font-family:monospace}
</style>
</head>
<body>
<div id="wrap"><div id="stage">

  <div id="topbar">
    <div class="brand">Next<em>Music</em></div>
    <div class="tabs" id="tabs"></div>
    <div class="ibtn" onclick="go('search')" title="搜索">⌕</div>
    <div class="ibtn" onclick="go('settings')" title="设置">⚙</div>
  </div>

  <div id="main">
    <div id="panel">
      <div id="cover" onclick="openPlayer()"></div>
      <div id="pname">未在播放</div>
      <div id="partist" onclick="artistSearch()">
        <svg width="15" height="15" viewBox="0 0 1024 1024" fill="rgba(179,179,184,.9)"><path d="M518.912 79.616a426.666667 426.666667 0 1 0 426.666667 426.666667 426.666667 426.666667 0 0 0-426.666667-426.666667z m0 640a213.333333 213.333333 0 1 1 213.333333-213.333333 213.333333 213.333333 0 0 1-213.333333 213.333333z"/><path d="M518.912 514.816m-85.333333 0a85.333333 85.333333 0 1 0 170.666666 0 85.333333 85.333333 0 1 0-170.666666 0Z"/><path d="M942.592 546.133333L687.786667 800.682667H518.144c-2.133333-12.288-8.533333-21.333333-16.298667-21.333334s-14.165333 9.045333-16.298666 21.333334h-17.834667v8.533333h17.066667c0 16.469333 7.68 29.866667 17.066666 29.866667s17.066667-13.397333 17.066667-29.866667H691.2l257.194667-257.28z"/></svg>
        <span>从首页选一首开始</span>
      </div>
      <div class="prow" onclick="seekAt(event)"><i id="pfill" style="width:0%"></i></div>
      <div id="times"><span id="t1">0:00</span><span id="t2">0:00</span></div>
      <div id="ctrls">
        <div class="cbtn" onclick="prev()">⏮</div>
        <div class="cbtn" id="play" onclick="toggle()">▶</div>
        <div class="cbtn" onclick="next()">⏭</div>
      </div>
      <div id="tools">
        <div class="tool" id="tfav" onclick="favOverlay(true)">♥</div>
        <div class="tool" onclick="toast('已加入下载队列（demo）')">⬇</div>
        <div class="tool" onclick="go('queue')">☰</div>
        <div class="tool" onclick="toast('音效设置（demo）')">⚙̶</div>
      </div>
      <div id="badges"><span class="badge" id="bsrc">—</span><span class="badge">320k</span></div>
      <div id="qanchor" onclick="go('queue')">正在播放 · 队列 <b id="qn">0</b> 首 ›</div>
    </div>

    <div id="content">
      <div class="page" id="pg-home"></div>
      <div class="page" id="pg-explore"></div>
      <div class="page" id="pg-boards"></div>
      <div class="page" id="pg-podcast"></div>
      <div class="page" id="pg-medialibs"></div>
      <div class="page" id="pg-queue"></div>
      <div class="page" id="pg-search"></div>
      <div class="page" id="pg-settings"></div>
    </div>
  </div>

  <!-- 收藏覆盖层 -->
  <div class="ov" id="fav">
    <div class="ovhead"><div class="back" onclick="favOverlay(false)">‹</div><b>我的收藏</b></div>
    <div class="ovbody" id="favbody"></div>
  </div>

  <!-- CarPlayer 全屏 -->
  <div id="player">
    <div id="pbg"></div><div id="pveil"></div>
    <div id="pback" onclick="closePlayer()">‹</div>
    <div id="pin">
      <div id="pinfo">
        <div id="pt">—</div>
        <div id="pa" onclick="artistSearch()">
          <svg width="16" height="16" viewBox="0 0 1024 1024" fill="rgba(179,179,184,.9)"><path d="M518.912 79.616a426.666667 426.666667 0 1 0 426.666667 426.666667 426.666667 426.666667 0 0 0-426.666667-426.666667z m0 640a213.333333 213.333333 0 1 1 213.333333-213.333333 213.333333 213.333333 0 0 1-213.333333 213.333333z"/><path d="M518.912 514.816m-85.333333 0a85.333333 85.333333 0 1 0 170.666666 0 85.333333 85.333333 0 1 0-170.666666 0Z"/><path d="M942.592 546.133333L687.786667 800.682667H518.144c-2.133333-12.288-8.533333-21.333333-16.298667-21.333334s-14.165333 9.045333-16.298666 21.333334h-17.834667v8.533333h17.066667c0 16.469333 7.68 29.866667 17.066666 29.866667s17.066667-13.397333 17.066667-29.866667H691.2l257.194667-257.28z"/></svg>
          <span id="paName">—</span>
        </div>
        <div id="pchips"><span onclick="toast('音质：无损 FLAC')">无损</span><span onclick="toast('倍速 1.0×')">1.0×</span><span onclick="toast('定时关闭（demo）')">定时</span><span onclick="toast('已收藏')">♥</span></div>
        <div id="pctrls">
          <div class="cbtn" onclick="prev()">⏮</div>
          <div class="cbtn" id="play2" onclick="toggle()" style="width:58px;height:58px;border-radius:29px;background:var(--brand);color:var(--on)">▶</div>
          <div class="cbtn" onclick="next()">⏭</div>
        </div>
      </div>
      <div id="vinyl"><div class="disc"></div><div class="lab" id="vlab"></div><div class="hole"></div></div>
    </div>
    <div id="pbar">
      <div class="prow" onclick="seekAt(event)"><i id="pfill2" style="width:0%"></i></div>
      <div id="times" style="margin-top:6px"><span id="t3">0:00</span><span id="t4">0:00</span></div>
    </div>
  </div>

  <div id="toast"></div>
</div></div>
<div class="scale-note" id="note"></div>

<script>
/* ---------- demo 数据 ---------- */
var H=[4,16,28,40,52,64,76,88,100,112,124,136,148,160,172,184];
var S=[62,55,48,70,58];
var songs=[
 {n:"晴天",a:"周杰伦",al:"叶惠美",d:269},{n:"七里香",a:"周杰伦",al:"七里香",d:296},
 {n:"江南",a:"林俊杰",al:"第二天堂",d:285},{n:"修炼爱情",a:"林俊杰",al:"因你而在",d:278},
 {n:"光年之外",a:"邓紫棋",al:"光年之外",d:235},{n:"泡沫",a:"邓紫棋",al:"Xposed",d:252},
 {n:"十年",a:"陈奕迅",al:"黑·白·灰",d:326},{n:"孤勇者",a:"陈奕迅",al:"孤勇者",d:265},
 {n:"海阔天空",a:"Beyond",al:"乐与怒",d:326},{n:"真的爱你",a:"Beyond",al:"Beyond IV",d:267},
 {n:"7 Years",a:"Lukas Graham",al:"Lukas Graham",d:228},{n:"Love Yourself",a:"Justin Bieber",al:"Purpose",d:237}
];
var queue=[0,2,4,6,8,10],qi=0,fav=[1,3],pos=0,playing=false,timer=null;
var TABS=[["home","首页"],["explore","探索"],["boards","榜单"],["podcast","播客"],["medialibs","乐库"]];
var HOT=["周杰伦","晚安电台","郭德纲相声","华语经典","白噪音","80年代"];
function grad(i){var h=H[i%H.length];return "linear-gradient(135deg,hsl("+h+","+S[i%5]+"%,42%),hsl("+((h+38)%180)+","+S[(i+1)%5]+"%,22%))"}
function songRow(idx){var s=songs[idx];var now=queue[qi]===idx&&playing;
 return '<div class="srow" onclick="play('+idx+')"><div class="cv" style="background:'+grad(idx)+'"></div><div class="m"><b>'+(now?'<span class="now">▶</span>':'')+s.n+'</b><span>'+s.a+' · '+s.al+'</span></div>'+(idx%3?'<span class="qi">SQ</span>':'')+'<span style="color:var(--text3);font-size:12px">'+fmt(s.d)+'</span></div>'}
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function card(i,t,a){return '<div class="card" onclick="play('+i+')"><div class="cv" style="background:'+grad(i)+'"><div class="sq">'+t.slice(0,2)+'</div></div><div class="nm">'+t+'</div><div class="ar">'+a+'</div></div>'}

/* ---------- 页面渲染 ---------- */
function pgHome(){var h='<div class="ptitle">首页</div><div class="sec">每日精选</div><div class="grid">'+card(0,"晴天","周杰伦")+card(2,"江南","林俊杰")+card(4,"光年之外","邓紫棋")+card(6,"十年","陈奕迅")+card(8,"海阔天空","Beyond")+'</div><div class="sec">为我推荐</div><div class="grid">'+card(10,"7 Years","Lukas Graham")+card(1,"七里香","周杰伦")+card(3,"修炼爱情","林俊杰")+card(5,"泡沫","邓紫棋")+card(9,"真的爱你","Beyond")+'</div><div class="sec">新歌速递</div><div class="grid">'+card(11,"Love Yourself","Justin Bieber")+card(7,"孤勇者","陈奕迅")+card(0,"晴天","周杰伦")+card(2,"江南","林俊杰")+card(6,"十年","陈奕迅")+'</div>';return h}
function pgExplore(){return '<div class="ptitle">探索</div><div class="sec">心情电台</div><div class="grid">'+card(0,"通勤路上","早高峰专属")+card(1,"深夜电台","助眠白噪音")+card(2,"运动节奏","BPM 128-140")+card(3,"咖啡时光","Chill & Jazz")+card(4,"雨天氛围","Lo-Fi 精选")+'</div><div class="sec">年代精选</div><div class="grid">'+card(5,"80年代","经典重制")+card(6,"90黄金","港乐巅峰")+card(7,"00青春","华语流行")+card(8,"10潮流","电子混音")+card(9,"2026新声","本周新歌")+'</div>'}
function pgBoards(){var b=[["热歌榜","全网热度TOP100","3.2亿"],["新歌榜","近30天新歌首发","8600万"],["飙升榜","增长最快","4100万"],["原创榜","独立音乐人","2200万"],["电音榜","EDM/_house","1800万"],["播客榜","热门节目","1500万"]];var h='<div class="ptitle">榜单</div>';b.forEach(function(x,i){h+='<div class="board" onclick="toast('打开'+x[0]+'（demo）')"><div class="no">'+(i+1)+'</div><div class="t"><b>'+x[0]+'</b><span>'+x[1]+'</span></div><div class="heat">🔥 '+x[2]+'</div></div>'});return h}
function pgPodcast(){return '<div class="ptitle">播客</div><div class="sec">热门节目</div><div class="grid">'+card(1,"晚安电台","365期")+card(3,"科技早知道","198期")+card(5,"故事FM","512期")+card(7,"谐星聊天会","88期")+card(9,"忽左忽右","240期")+'</div><div class="sec">单集推荐</div>'+songRow(1)+songRow(5)+songRow(9)}
function pgLibs(){return '<div class="ptitle" style="display:flex;align-items:center">媒体库<span style="margin-left:auto;font-size:13px;background:var(--brand);color:var(--on);padding:8px 20px;border-radius:16px;cursor:pointer" onclick="toast('添加音源（demo）')">＋ 添加</span></div><div class="lib" onclick="favOverlay(true)"><div class="ic" style="background:rgba(30,215,96,.15);color:var(--brand)">♥</div><div style="flex:1"><b>我的收藏</b><span>收藏的歌曲 · 点击查看</span></div><span class="chev">›</span></div><div class="lib" onclick="toast('Emby · MediaBox（demo）')"><div class="ic" style="background:rgba(82,154,255,.15);color:#529aff">E</div><div style="flex:1"><b>Emby</b><span>MediaBox · NAS 影音库 · 点击管理</span></div><span class="chev">›</span></div><div class="lib" onclick="toast('Navidrome（demo）')"><div class="ic" style="background:rgba(255,159,10,.15);color:#ff9f0a">N</div><div style="flex:1"><b>Navidrome</b><span>开源音乐库 · 已连接</span></div><span class="chev">›</span></div>'}
function pgQueue(){var h='<div class="ptitle" style="display:flex;align-items:center">播放队列<span style="margin-left:auto;font-size:13px;border:1px solid var(--border);padding:8px 20px;border-radius:16px;cursor:pointer" onclick="toast('队列已清空（demo）')">清空</span></div>';queue.forEach(function(si,k){h+=songRow(si)});return h}
function pgSearch(){var h='<div class="ptitle">搜索</div><input id="sq" placeholder="搜索歌曲 / 歌手 / 专辑…" oninput="doSearch(this.value)"><div class="sec">热门搜索</div><div class="hot">'+HOT.map(function(w){return '<span onclick="searchFor(\''+w+'\')">'+w+'</span>'}).join("")+'</div><div id="sres"></div>';return h}
function pgSettings(){var s=[["下载管理","12 首已下载"],["车机模式","当前为车机专属界面 · 点击关闭恢复手机竖版"],["音源管理","LX 音源 · 自定义脚本"],["在线播放音质","无损 · 点击切换"],["下载设置","仅 Wi-Fi 下载"]];var h='<div class="ptitle">设置</div>';s.forEach(function(x){h+='<div class="set" onclick="toast(\''+x[0]+'（demo）\')"><div class="k">'+x[0]+'</div><div class="v">'+x[1]+' ›</div></div>'});return h+'<div class="set"><div class="k">版本</div><div class="v">车机 v8.1 · vc181 · 1:1 demo</div></div>'}

var PAGES={home:pgHome,explore:pgExplore,boards:pgBoards,podcast:pgPodcast,medialibs:pgLibs,queue:pgQueue,search:pgSearch,settings:pgSettings};
var page="home";
function go(p){page=p;render()}
function render(){
 document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("on",t.dataset.k===page)});
 ["home","explore","boards","podcast","medialibs","queue","search","settings"].forEach(function(k){var el=document.getElementById("pg-"+k);if(!el.dataset.built){el.innerHTML=PAGES[k]();el.dataset.built="1"}el.classList.toggle("on",k===page)});
}
/* tabs */
document.getElementById("tabs").innerHTML=TABS.map(function(t){return '<div class="tab" data-k="'+t[0]+'" onclick="go(\''+t[0]+'\')">'+t[1]+'<div class="u"></div></div>'}).join("");

/* ---------- 播放引擎（demo） ---------- */
function cur(){return songs[queue[qi]]}
function syncPanel(){
 var s=cur();
 document.getElementById("cover").style.background=grad(queue[qi]);
 document.getElementById("cover").textContent=s.n.slice(0,1);
 document.getElementById("pname").textContent=s.n;
 document.getElementById("partist").querySelector("span").textContent=s.a+" · "+s.al;
 document.getElementById("bsrc").textContent=qi%2?"酷我":"网易云";
 document.getElementById("qn").textContent=queue.length;
 document.getElementById("play").textContent=playing?"⏸":"▶";
 document.getElementById("play2").textContent=playing?"⏸":"▶";
 document.getElementById("vinyl").classList.toggle("spin",playing);
 document.getElementById("pt").textContent=s.n;
 document.getElementById("paName").textContent=s.a+" · "+s.al;
 document.getElementById("vlab").style.background=grad(queue[qi]);
 document.getElementById("pbg").style.background=grad(queue[qi]);
 tickUI();
}
function tickUI(){
 var s=cur();
 document.getElementById("t2").textContent=fmt(s.d);document.getElementById("t4").textContent=fmt(s.d);
 document.getElementById("t1").textContent=fmt(pos);document.getElementById("t3").textContent=fmt(pos);
 document.getElementById("pfill").style.width=(pos/s.d*100)+"%";
 document.getElementById("pfill2").style.width=(pos/s.d*100)+"%";
}
function play(i){var at=queue.indexOf(i);if(at<0){queue.push(i);at=queue.length-1}qi=at;pos=0;playing=true;startTimer();document.getElementById("pg-queue").dataset.built="";render();syncPanel();toast("正在播放 · "+songs[i].n)}
function toggle(){playing=!playing;startTimer();syncPanel();render()}
function next(){qi=(qi+1)%queue.length;pos=0;document.getElementById("pg-queue").dataset.built="";render();syncPanel()}
function prev(){qi=(qi-1+queue.length)%queue.length;pos=0;document.getElementById("pg-queue").dataset.built="";render();syncPanel()}
function seekAt(e){var r=e.currentTarget.getBoundingClientRect();pos=Math.round(cur().d*(e.clientX-r.left)/r.width);tickUI()}
function startTimer(){clearInterval(timer);if(playing)timer=setInterval(function(){pos++;if(pos>=cur().d){next()}else tickUI()},1000)}
function artistSearch(){var a=cur().a;go("search");setTimeout(function(){var q=document.getElementById("sq");q.value=a;doSearch(a)},50)}
function doSearch(w){var el=document.getElementById("sres");if(!el)return;if(!w.trim()){el.innerHTML="";return}
 var hit=songs.filter(function(s){return (s.n+s.a+s.al).toLowerCase().includes(w.trim().toLowerCase())});
 el.innerHTML='<div class="sec">"'+w+'" 的结果 · '+hit.length+' 首</div>'+(hit.map(function(s){return songRow(songs.indexOf(s))}).join("")||'<div style="color:var(--text3);padding:20px 0">无结果</div>')}
function searchFor(w){go("search");var q=document.getElementById("sq");q.value=w;doSearch(w)}
function openPlayer(){document.getElementById("player").classList.add("on")}
function closePlayer(){document.getElementById("player").classList.remove("on")}
function favOverlay(on){document.getElementById("fav").classList.toggle("on",on);if(on){var b=document.getElementById("favbody");b.innerHTML=fav.length?fav.map(function(i){return songRow(i)}).join(""):'<div style="color:var(--text3);padding:30px;text-align:center">还没有收藏</div>'}}
var tt;function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("on")},1800)}

/* ---------- 适配缩放 ---------- */
function fit(){var s=Math.min(innerWidth/1300,innerHeight/740,1);document.getElementById("stage").style.transform="scale("+s+")";document.getElementById("note").textContent="1280×720 · scale "+s.toFixed(2)}
addEventListener("resize",fit);fit();
render();syncPanel();
</script>
</body>
</html>
