 return '<div class="srow" onclick="play('+idx+')"><div class="cv" style="background:'+grad(idx)+'"></div><div class="m"><b>'+(now?'<span class="now">▶</span>':'')+s.n+'</b><span>'+s.a+' · '+s.al+'</span></div>'+(idx%3?'<span class="qi">SQ</span>':'')+'<span style="color:var(--text3);font-size:12px">'+fmt(s.d)+'</span></div>'}
function card(i,t,a,onclick,tip){return '<div class="card" onclick="'+(onclick||'play('+i+')')+'"><div class="cv" style="background:'+grad(i)+'"><div class="sq">'+t.slice(0,2)+'</div>'+(tip?'<div class="tip">'+tip+'</div>':'')+'</div><div class="nm">'+t+'</div><div class="ar">'+a+'</div></div>'}

 LIBS.forEach(function(L){var t=TYPES[L.type];h+='<div class="lib" onclick="openLib('+L.id+')"><div class="ic" style="background:'+t.c+'22;color:'+t.c+'">'+t.n[0]+'</div><div style="flex:1"><b>'+L.name+'</b><span>'+t.n+' · '+L.host+' · 点击浏览</span></div><span class="chev">›</span></div>'});

 h+='<div style="display:flex;align-items:center;gap:14px;background:'+t.c+'18;border-radius:14px;padding:14px 18px;margin-bottom:16px"><div class="ic" style="width:44px;height:44px;border-radius:12px;background:'+t.c+';color:#000;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px">'+t.n[0]+'</div><div><b>'+t.n+'</b><div style="font-size:12px;color:var(--text3)">'+t.hint+'</div></div></div>';
 h+='<div class="fld"><label>服务器地址</label><input id="f_host" value="'+(L.host||"")+'" placeholder="'+(formType==="emby"?"http://192.168.1.10:8096":formType==="navidrome"?"http://192.168.1.10:4533":"https://…")+'"></div>';

 return h}

 var h='<div class="ptitle">'+bk("go('medialibs')")+'<div style="width:40px;height:40px;border-radius:12px;background:'+t.c+';color:#000;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;margin-right:10px">'+t.n[0]+'</div>'+L.name+'<span style="margin-left:10px;font-size:11px;color:'+t.c+';border:1px solid '+t.c+'66;padding:2px 10px;border-radius:10px;font-weight:400">'+t.n+'</span><span style="margin-left:auto;font-size:13px;border:1px solid var(--border);padding:8px 20px;border-radius:16px;cursor:pointer" onclick="editLibGo('+L.id+')">管理</span></div>';
 h+='<div class="sec">艺人</div><div class="grid">';L.artists.forEach(function(a,i){h+=card(i+2,a.n,a.al+" 张专辑","openArtist("+i+")",a.n.slice(0,3))});h+='</div>';
 h+='<div class="sec">专辑</div><div class="grid">';L.albums.forEach(function(ab,i){h+=card(i+5,ab.n,ab.a+" · "+ab.y,"openAlbum("+i+")","Album")});h+='</div>';
 h+='<div class="sec">全部歌曲 · '+L.songsIdx.length+' 首</div>';L.songsIdx.slice().reverse().forEach(function(i){h+=songRow(i)});
 return h}

 h+='<div class="sec">专辑</div><div class="grid">';curLib.albums.filter(function(ab){return ab.a===a.n}).forEach(function(ab,i){h+=card(i+8,ab.n,ab.y,"toast('打开专辑 "+ab.n+"（demo）')","Album")});
 if(!curLib.albums.filter(function(ab){return ab.a===a.n}).length)curLib.albums.slice(0,3).forEach(function(ab,i){h+=card(i+8,ab.n,ab.y,"toast('打开专辑 "+ab.n+"（demo）')","Album")});h+='</div>';
 h+='<div class="sec">热门歌曲</div>';curLib.songsIdx.filter(function(i){return songs[i].a===a.n}).forEach(function(i){h+=songRow(i)});
 var alt=curLib.songsIdx.slice(0,3);alt.forEach(function(i){if(songs[i].a!==a.n)h+=songRow(i)});
 return h}

 curLib.songsIdx.forEach(function(i){h+=songRow(i)});return h}

function pgSearch(){return '<div class="ptitle">搜索</div><input id="sq" placeholder="搜索歌曲 / 歌手 / 专辑…" oninput="doSearch(this.value)"><div class="sec">热门搜索</div><div class="hot">'+HOT.map(function(w){return '<span onclick="searchFor(\''+w+'\')">'+w+'</span>'}).join("")+'</div><div id="sres"></div>'}

 var h='<div class="ptitle">设置</div>';s.forEach(function(x){h+='<div class="set" onclick="'+(x[0]==="settings"?"toastCarMode()":"go(\''+x[0]+'\')")+'"><div class="k">'+x[1]+'</div><div class="v">'+x[2]+' ›</div></div>'});
 return h+'<div class="set" style="opacity:.6"><div class="k">关于</div><div class="v">车机 v8.1 · vc181 · 1:1 demo</div></div>'}
function pgSetdl(){var h='<div class="ptitle">'+bk("go('settings')")+'下载管理</div>';DLQ.forEach(function(d){var s=songs[d.i];
 h+='<div class="dlrow"><div class="cv" style="background:'+grad(d.i)+'"></div><div class="m"><b>'+s.n+'</b><span>'+s.a+' · '+(d.p>=100?'已完成 · 无损':d.p+'% · 无损')+'</span><div class="bar"><i style="width:'+d.p+'%"></i></div></div>'+(d.p>=100?'<span style="color:var(--brand)">✓</span>':'<span style="color:var(--text3);font-size:12px">'+d.p+'%</span>')+'</div>'});return h+'<div style="display:flex;gap:14px;margin-top:14px"><div class="btn" onclick="toast(\'全部暂停（demo）\')">全部暂停</div><div class="btn danger" onclick="toast(\'清空已完成（demo）\')">清空已完成</div></div>'}
function pgSetsrc(){var h='<div class="ptitle">'+bk("go('settings')")+'音源管理</div><div class="sec">在线音源（LX 引擎）</div>';
 ["kw 酷我","kg 酷狗","wy 网易","tx QQ音乐","mg 咪咕"].forEach(function(x,i){h+='<div class="set"><div class="k">'+x+'</div><div class="v">'+(i<4?'已启用':'备用')+'</div></div>'});
 h+='<div class="sec">自定义脚本</div><div class="set" onclick="toast(\'导入自定义音源脚本（demo）\')"><div class="k">导入脚本</div><div class="v">.js / .lxsc ›</div></div><div class="set" onclick="toast(\'听风源已连接（demo）\')"><div class="k">听风源</div><div class="v">已连接 ›</div></div>';return h}

 ["无损","320k","128k"].forEach(function(q){h+='<div class="pill'+(quality===q?' on':'')+'" onclick="setQ(\''+q+'\')">'+q+'</div>'});
 h+='</div><div class="sec">下载音质</div><div class="pillbar">';
 ["无损","320k","128k"].forEach(function(q){h+='<div class="pill'+(dlq===q?' on':'')+'" onclick="dlQ(\''+q+'\')">'+q+'</div>'});
 return h+'</div><div class="sec">下载网络</div><div class="set" onclick="toast(\'切换下载网络（demo）\')"><div class="k">仅 Wi-Fi 下载</div><div class="v">已开启 ›</div></div>'}
/* ================= 引擎 ================= */
var PAGES={home:pgHome,explore:pgExplore,boards:pgBoards,boarddetail:pgBoarddetail,podcast:pgPodcast,pcdetail:pgPcdetail,medialibs:pgLibs,libadd:pgLibadd,libform:pgLibform,libdetail:pgLibdetail,artist:pgArtist,album:pgAlbum,queue:pgQueue,search:pgSearch,settings:pgSettings,setdl:pgSetdl,setsrc:pgSetsrc,setq:pgSetq};
var page="home";
function go(p){page=p;render()}
function render(){
 document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("on",t.dataset.k===page)});
 Object.keys(PAGES).forEach(function(k){var el=document.getElementById("pg-"+k);if(!el)return;if(!el.dataset.built){el.innerHTML=PAGES[k]();el.dataset.built="1"}el.classList.toggle("on",k===page)});
}
function rebuild(p){var el=document.getElementById("pg-"+p);if(el){el.dataset.built="";if(page===p)render()}}
document.getElementById("tabs").innerHTML=TABS.map(function(t){return '<div class="tab" data-k="'+t[0]+'" onclick="go(\''+t[0]+'\')">'+t[1]+'<div class="u"></div></div>'}).join("");
function cur(){return songs[queue[qi]]}
function syncPanel(){var s=cur();
 cover.style.background=grad(queue[qi]);cover.textContent=s.n.slice(0,1);
 pname.textContent=s.n;partist.querySelector("span").textContent=s.a+" · "+s.al;
 bsrc.textContent=qi%2?"酷我":"网易云";qn.textContent=queue.length;
 play.textContent=playing?"⏸":"▶";play2.textContent=playing?"⏸":"▶";
 document.getElementById("vinyl").classList.toggle("spin",playing);
 pt.textContent=s.n;paName.textContent=s.a+" · "+s.al;
 vlab.style.background=grad(queue[qi]);pbg.style.background=grad(queue[qi]);
 tickUI()}
function tickUI(){var s=cur();
 t2.textContent=fmt(s.d);t4.textContent=fmt(s.d);t1.textContent=fmt(pos);t3.textContent=fmt(pos);
 pfill.style.width=(pos/s.d*100)+"%";pfill2.style.width=(pos/s.d*100)+"%"}
function play(i){var at=queue.indexOf(i);if(at<0){queue.push(i);at=queue.length-1}qi=at;pos=0;playing=true;startTimer();rebuild("queue");render();syncPanel();toast("正在播放 · "+songs[i].n)}
function toggle(){playing=!playing;startTimer();syncPanel();render()}
function next(){qi=(qi+1)%queue.length;pos=0;rebuild("queue");render();syncPanel()}
function prev(){qi=(qi-1+queue.length)%queue.length;pos=0;rebuild("queue");render();syncPanel()}
function seekAt(e){var r=e.currentTarget.getBoundingClientRect();pos=Math.round(cur().d*(e.clientX-r.left)/r.width);tickUI()}
function startTimer(){clearInterval(timer);if(playing)timer=setInterval(function(){pos++;if(pos>=cur().d){next()}else tickUI()},1000)}
function artistSearch(){var a=cur().a;go("search");setTimeout(function(){var q=document.getElementById("sq");q.value=a;doSearch(a)},50)}
function doSearch(w){var el=document.getElementById("sres");if(!el)return;if(!w.trim()){el.innerHTML="";return}
 var hit=songs.filter(function(s){return (s.n+s.a+s.al).toLowerCase().indexOf(w.trim().toLowerCase())>=0});
 el.innerHTML='<div class="sec">"'+w+'" 的结果 · '+hit.length+' 首</div>'+(hit.map(function(s){return songRow(songs.indexOf(s))}).join("")||'<div style="color:var(--text3);padding:20px 0">无结果</div>')}
function searchFor(w){go("search");var q=document.getElementById("sq");q.value=w;doSearch(w)}
function openPlayer(){document.getElementById("player").classList.add("on")}
function closePlayer(){document.getElementById("player").classList.remove("on")}
function favOverlay(on){document.getElementById("fav").classList.toggle("on",on);if(on){var b=document.getElementById("favbody");b.innerHTML=fav.length?fav.map(function(i){return songRow(i)}).join(""):'<div style="color:var(--text3);padding:30px;text-align:center">还没有收藏</div>'}}
/* ---- 媒体库流程 ---- */
function openLib(id){curLib=LIBS.find(function(L){return L.id===id});rebuild("libdetail");go("libdetail")}
function openArtist(i){curArtist=i;rebuild("artist");go("artist")}
function openAlbum(i){curAlbum=i;rebuild("album");go("album")}
function openBoard(i){curBoard=i;rebuild("boarddetail");go("boarddetail")}
function openPod(i){curPod=i;rebuild("pcdetail");go("pcdetail")}
function startForm(t){formType=t;editLib=null;rebuild("libform");go("libform")}
function editLibGo(id){editLib=LIBS.find(function(L){return L.id===id});formType=editLib.type;rebuild("libform");go("libform")}
function testConn(){var b=document.getElementById("tconn");b.textContent="连接中…";
 setTimeout(function(){b.textContent="✓ 连接测试通过 · 43 ms";b.style.color="var(--brand)";b.style.borderColor="var(--brand)";toast("连接测试通过 · 43 ms")},800)}
function saveLib(){var host=document.getElementById("f_host").value.trim()||TYPES[formType].hint.split(" · ")[1];
 if(editLib){editLib.host=host;editLib.user=document.getElementById("f_user").value.trim()||editLib.user;var nm=document.getElementById("f_name").value.trim();if(nm)editLib.name=nm;toast("已保存修改");rebuild("medialibs");openLib(editLib.id)}
 else{var L={id:libSeq++,type:formType,name:document.getElementById("f_name").value.trim()||TYPES[formType].n+" 音源",host:host,user:document.getElementById("f_user").value.trim()||"user",
  artists:[{n:"周杰伦",al:10},{n:"邓紫棋",al:8},{n:"Beyond",al:6},{n:"陈奕迅",al:12}],
  albums:[{n:"叶惠美",a:"周杰伦",y:2003},{n:"光年之外",a:"邓紫棋",y:2016},{n:"乐与怒",a:"Beyond",y:1993}],
  songsIdx:[0,4,8,6]};LIBS.push(L);toast("已连接 · "+L.name);rebuild("medialibs");openLib(L.id)}}
function delLib(){if(confirmDel)return;var id=editLib.id;LIBS=LIBS.filter(function(L){return L.id!==id});toast("已删除音源");editLib=null;rebuild("medialibs");go("medialibs")}
var confirmDel=false;
function toastCarMode(){toast("车机模式（demo 保持车机形态）")}
function setQ(q){quality=q;rebuild("setq");render();toast("在线播放音质 · "+q)}
function dlQ(q){dlq=q;rebuild("setq");render();toast("下载音质 · "+q)}
var tt;function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("on")},1800)}
function fit(){var s=Math.min(innerWidth/1300,innerHeight/740,1);document.getElementById("stage").style.transform="scale("+s+")";document.getElementById("note").textContent="1280×720 · scale "+s.toFixed(2)}
addEventListener("resize",fit);fit();
render();syncPanel();
</script>
