<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NextMusic 车机版 v8.1 · 1:1 高保真 Demo</title>
<style>
:root{--bg:#0e0e0f;--surface:#151516;--surface2:#1d1d1f;--border:#26262a;--text:#fff;--text2:#b3b3b8;--text3:#77777d;--brand:#1ed760;--on:#000;--track:#2c2c30}
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{height:100%;background:#000;overflow:hidden;font-family:-apple-system,'PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',sans-serif;color:var(--text)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;background:var(--bg);position:relative;overflow:hidden;border-radius:10px;box-shadow:0 0 80px rgba(0,0,0,.9);flex:none}
#topbar{height:52px;display:flex;align-items:center;gap:8px;padding:0 33px;background:var(--bg);border-bottom:1px solid var(--border)}
.brand{font-size:19px;font-weight:800;margin-right:14px}
.brand em{font-style:normal;color:var(--brand)}
.tabs{display:flex;flex:1}
.tab{height:52px;padding:0 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:17px;font-weight:600;color:var(--text2)}
.tab.on{color:var(--text);font-weight:800}
.tab .u{width:20px;height:3px;border-radius:2px;background:var(--brand);margin-top:4px;visibility:hidden}
.tab.on .u{visibility:visible}
.ibtn{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:17px}
.ibtn:hover{color:var(--text)}
#main{display:flex;height:668px}
#panel{width:300px;background:var(--surface);border-right:1px solid var(--border);padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px}
#cover{width:260px;height:260px;border-radius:16px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;font-size:44px;color:rgba(255,255,255,.5)}
#pname{width:100%;font-size:18px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#partist{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;color:var(--text2);cursor:pointer;white-space:nowrap;overflow:hidden}
#partist span{overflow:hidden;text-overflow:ellipsis}
.prow{width:100%;height:4px;border-radius:2px;background:var(--track);display:flex;overflow:hidden;cursor:pointer}
.prow i{background:var(--brand);height:100%}
#times{width:100%;display:flex;justify-content:space-between;font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}
#ctrls{display:flex;align-items:center;gap:18px;margin-top:6px}
.cbtn{width:40px;height:40px;border-radius:20px;background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.cbtn:hover{color:var(--brand)}
#play{width:56px;height:56px;border-radius:28px;background:var(--brand);color:var(--on)}
#tools{display:flex;gap:12px;margin-top:8px}
.tool{width:36px;height:36px;border-radius:18px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);background:none}
.tool:hover{color:var(--brand);border-color:var(--brand)}
#badges{display:flex;gap:8px}
.badge{font-size:11px;color:var(--text3);background:var(--surface2);padding:3px 10px;border-radius:10px}
#qanchor{margin-top:auto;padding:8px 0 2px;font-size:12px;color:var(--text3);cursor:pointer}
#qanchor:hover{color:var(--text2)}
#content{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:18px 33px 40px;display:none}
.page.on{display:block}
.page::-webkit-scrollbar{width:0}
.ptitle{font-size:22px;font-weight:800;margin-bottom:14px;display:flex;align-items:center}
.backlink{width:40px;height:40px;border-radius:20px;background:var(--surface2);display:flex;align-items:center;justify-content:center;margin-right:14px;cursor:pointer;font-size:18px}
.backlink:hover{color:var(--brand)}
.sechead{display:flex;align-items:center;margin:20px 0 12px}
.sechead b{font-size:16px;font-weight:700}
.sechead span{font-size:11px;color:var(--text3);margin-left:10px}
.sechead .more{margin-left:auto;font-size:12px;color:var(--text3);cursor:pointer}
.sechead .more:hover{color:var(--text2)}
/* 问候 hero */
.hero{font-size:26px;font-weight:800;padding:6px 0 2px}
.hero small{display:block;font-size:12px;color:var(--text3);font-weight:400;margin-top:4px}
/* 双大卡 v7: 474×210 */
.bigrow{display:flex;gap:25px;margin-top:16px}
.bigcard{width:474px;height:210px;border-radius:16px;padding:22px;position:relative;overflow:hidden;cursor:pointer;flex:none}
.bigcard .bdg{font-size:11px;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:3px 10px;width:fit-content}
.bigcard .t{font-size:24px;font-weight:800;margin-top:52px}
.bigcard .s{font-size:13px;color:rgba(255,255,255,.6);margin-top:6px}
.bigcard .disk{position:absolute;right:-36px;bottom:-36px;width:170px;height:170px;border-radius:50%;background:rgba(0,0,0,.25);border:14px solid rgba(255,255,255,.07)}
/* rail 横滑 */
.rail{display:flex;gap:25px;overflow-x:auto;padding-bottom:4px}
.rail::-webkit-scrollbar{height:0}
.rail .card{flex:none}
/* 卡网格 5×162.8 */
.grid{display:grid;grid-template-columns:repeat(5,162.8px);gap:25px}
.card{cursor:pointer}
.card .cv{width:162.8px;height:162.8px;border-radius:12px;position:relative;overflow:hidden}
.rail .card .cv{width:148px;height:148px}
.card .cv .sq{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;color:rgba(255,255,255,.55)}
.card .cv .tip{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.card .cv .pinsync{position:absolute;right:8px;top:8px;font-size:10px;background:rgba(0,0,0,.5);border-radius:8px;padding:2px 8px;color:#9fd6ff}
.card .nm{font-size:13px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ar{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 榜单 4 列渐变卡 210 高 */
.bgrid{display:grid;grid-template-columns:repeat(4,217px);gap:25px}
.bcard{height:210px;border-radius:16px;padding:18px;position:relative;overflow:hidden;cursor:pointer}
.bcard:hover{filter:brightness(1.15)}
.bcard .chip{position:absolute;left:0;top:0;font-size:11px;background:rgba(0,0,0,.4);color:#fff;padding:5px 12px;border-radius:0 0 12px 0}
.bcard b{position:absolute;left:18px;bottom:44px;font-size:22px;font-weight:800}
.bcard span{position:absolute;left:18px;bottom:20px;font-size:12px;color:rgba(255,255,255,.65)}
.bcard .rank{position:absolute;right:16px;top:14px;font-size:13px;font-style:italic;color:rgba(255,255,255,.8)}
/* 歌单详情 hero */
.plhero{display:flex;gap:26px;align-items:flex-end;margin-bottom:8px}
.plhero .cv{width:210px;height:210px;border-radius:16px;flex:none;position:relative;overflow:hidden}
.plhero .m{flex:1;min-width:0}
.plhero .m .tag{font-size:11px;color:var(--text3)}
.plhero .m h2{font-size:28px;font-weight:800;margin:6px 0}
.plhero .m .meta{font-size:12px;color:var(--text3)}
.playall{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:var(--on);font-weight:700;font-size:14px;padding:11px 28px;border-radius:20px;cursor:pointer;margin:14px 0 6px}
/* pills */
.pillbar{display:flex;gap:12px;flex-wrap:wrap}
.pill{padding:9px 24px;border-radius:18px;border:1px solid var(--border);font-size:14px;color:var(--text2);cursor:pointer;white-space:nowrap}
.pill.on{color:var(--on);background:var(--brand);border-color:var(--brand);font-weight:700}
/* 歌曲/榜单行 */
.srow{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:12px;cursor:pointer}
.srow:hover{background:var(--surface2)}
.srow .cv{width:52px;height:52px;border-radius:10px;flex:none}
.srow .m{flex:1;min-width:0}
.srow .m b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .m span{font-size:12px;color:var(--text3)}
.srow .qi{font-size:11px;color:var(--brand);border:1px solid var(--brand);padding:1px 6px;border-radius:6px;margin-right:6px}
.srow .now{color:var(--brand);font-size:12px;margin-right:4px}
.lib{display:flex;align-items:center;gap:16px;padding:16px;border-radius:14px;background:var(--surface);margin-bottom:12px;cursor:pointer}
.lib:hover{background:var(--surface2)}
.lib .ic{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.lib b{display:block;font-size:16px}.lib span{font-size:12px;color:var(--text3)}
.lib .chev{color:var(--text3)}
#sq{width:100%;height:52px;border-radius:14px;background:var(--surface2);border:none;outline:none;color:var(--text);font-size:16px;padding:0 18px;margin-bottom:16px}
.hot{display:flex;flex-wrap:wrap;gap:10px}
.hot span{padding:8px 18px;border-radius:18px;background:var(--surface2);font-size:14px;color:var(--text2);cursor:pointer}
.hot span:hover{color:var(--text)}
.set{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;background:var(--surface);margin-bottom:12px;cursor:pointer;font-size:15px}
.set:hover{background:var(--surface2)}
.set .k{flex:1}.set .v{font-size:12px;color:var(--text3)}
.btn{padding:10px 30px;border-radius:18px;font-size:14px;cursor:pointer;border:1px solid var(--border);color:var(--text2)}
.btn.pri{background:var(--brand);color:var(--on);border-color:var(--brand);font-weight:700}
.btn.danger{color:#ff6b6b;border-color:rgba(255,107,107,.4)}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;color:var(--text3);margin-bottom:6px}
.fld input{width:100%;height:48px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:15px;padding:0 16px;outline:none}
.fld input:focus{border-color:var(--brand)}
.dlrow{display:flex;align-items:center;gap:14px;padding:12px;border-radius:12px;background:var(--surface);margin-bottom:10px}
.dlrow .cv{width:46px;height:46px;border-radius:10px}
.dlrow .m{flex:1}.dlrow .m b{font-size:14px;display:block}.dlrow .m span{font-size:11px;color:var(--text3)}
.dlrow .bar{height:4px;border-radius:2px;background:var(--track);margin-top:6px;overflow:hidden}
.dlrow .bar i{display:block;height:100%;background:var(--brand)}
.ov{position:absolute;inset:0;background:rgba(8,8,9,.96);z-index:50;display:none;flex-direction:column}
.ov.on{display:flex}
.ovhead{height:64px;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--border)}
.ovhead .back{width:44px;height:44px;border-radius:22px;background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ovhead b{font-size:18px}
.ovbody{flex:1;overflow-y:auto;padding:18px 33px 40px}
#player{position:absolute;inset:0;z-index:80;display:none}
#player.on{display:flex}
#pbg{position:absolute;inset:0;filter:blur(60px) brightness(.4);transform:scale(1.3)}
#pveil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.72))}
#pin{position:relative;flex:1;display:flex;align-items:center;padding:0 56px;gap:48px}
#pinfo{width:400px;display:flex;flex-direction:column;gap:12px}
#pt{font-size:30px;font-weight:800;line-height:1.25}
#pa{font-size:17px;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:8px}
#pchips{display:flex;gap:10px;margin-top:6px}
#pchips span{font-size:12px;border:1px solid var(--border);border-radius:14px;padding:5px 14px;color:var(--text2);cursor:pointer}
#pchips span:hover{color:var(--text);border-color:var(--text3)}
#pctrls{display:flex;align-items:center;gap:26px;margin-top:18px}
#pctrls .cbtn{width:64px;height:64px;border-radius:32px}
#pctrls #play{width:58px;height:58px;border-radius:29px}
#vinyl{width:359px;height:359px;flex:none;position:relative}
#vinyl .disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%,#111 0 30%,#0a0a0a 30% 100%);border:2px solid #1c1c1e;animation:spin 8s linear infinite;animation-play-state:paused}
#vinyl.spin .disc{animation-play-state:running}
#vinyl .lab{position:absolute;inset:26%;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center}
#vinyl .hole{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#000;box-shadow:0 0 0 3px #2a2a2c}
@keyframes spin{to{transform:rotate(360deg)}}
#pbar{position:absolute;left:56px;right:56px;bottom:34px}
#pback{position:absolute;left:24px;top:12px;z-index:5;width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;cursor:pointer}
#toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(30,30,32,.96);border:1px solid var(--border);font-size:14px;padding:12px 26px;border-radius:22px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
.scale-note{position:fixed;right:14px;bottom:10px;color:#3c3c40;font-size:12px;font-family:monospace}
/* 底部选择器 */
#chooser{position:absolute;left:0;right:0;bottom:0;background:#17171a;border-top:1px solid var(--border);border-radius:18px 18px 0 0;padding:20px 33px 24px;z-index:90;display:none}
#chooser.on{display:block}
#chooser b{font-size:16px;display:block;margin-bottom:14px}
/* 确认弹层 */
#confirm{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:95;display:none;align-items:center;justify-content:center}
#confirm.on{display:flex}
#confirm .box{background:#1b1b1e;border:1px solid var(--border);border-radius:16px;padding:26px 30px;width:420px}
#confirm .box p{font-size:14px;color:var(--text2);margin:10px 0 20px;line-height:1.6}
/* 手机形态预览 */
.phone-wrap{display:flex;align-items:center;justify-content:center;gap:60px;height:100%}
.phone{width:300px;height:620px;border-radius:36px;border:3px solid #2a2a2e;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.phone .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:90px;height:20px;border-radius:10px;background:#000;z-index:2}
.phone .pbody{position:absolute;inset:0;padding:48px 18px 18px;display:flex;flex-direction:column;gap:10px}
.phone .pcover{width:100%;aspect-ratio:1;border-radius:14px}
.phone .pname2{font-size:18px;font-weight:800;text-align:center}
.phone .part2{font-size:12px;color:var(--text2);text-align:center}
.phone .pctl{display:flex;justify-content:center;gap:26px;margin-top:6px}
.phone .pmini{margin-top:auto;background:var(--surface2);border-radius:14px;padding:10px;display:flex;align-items:center;gap:10px}
/* EQ */
.eqrow{display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;background:var(--surface);margin-bottom:10px;cursor:pointer}
.eqrow:hover{background:var(--surface2)}
.eqrow.on{border:1px solid var(--brand)}
.eqrow b{font-size:15px}.eqrow span{font-size:11px;color:var(--text3);display:block}
.bars{display:flex;gap:5px;align-items:flex-end;height:34px;margin-left:auto}
.bars i{width:5px;background:var(--text3);border-radius:2px;display:block}
.eqrow.on .bars i{background:var(--brand)}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="topbar">
    <div class="brand">Next<em>Music</em></div>
    <div class="tabs" id="tabs"></div>
    <div class="ibtn" onclick="go('search')">⌕</div>
    <div class="ibtn" onclick="go('settings')">⚙</div>
  </div>
  <div id="main">
    <div id="panel">
      <div id="cover" onclick="openPlayer()"></div>
      <div id="pname">未在播放</div>
      <div id="partist" onclick="artistSearch()">
        <svg width="15" height="15" viewBox="0 0 1024 1024" fill="rgba(179,179,184,.9)"><path d="M518.912 79.616a426.666667 426.666667 0 1 0 426.666667 426.666667 426.666667 426.666667 0 0 0-426.666667-426.666667z m0 640a213.333333 213.333333 0 1 1 213.333333-213.333333 213.333333 213.333333 0 0 1-213.333333 213.333333z"/><path d="M518.912 514.816m-85.333333 0a85.333333 85.333333 0 1 0 170.666666 0 85.333333 85.333333 0 1 0-170.666666 0Z"/><path d="M942.592 546.133333L687.786667 800.682667H518.144c-2.133333-12.288-8.533333-21.333333-16.298667-21.333334s-14.165333 9.045333-16.298666 21.333334h-17.834667v8.533333h17.066667c0 16.469333 7.68 29.866667 17.066666 29.866667s17.066667-13.397333 17.066667-29.866667H691.2l257.194667-257.28z"/></svg>
        <span>从首页选一首开始</span>
      </div>
      <div class="prow" onclick="seekAt(event)"><i id="pfill" style="width:0%"></i></div>
      <div id="times"><span id="t1">0:00</span><span id="t2">0:00</span></div>
      <div id="ctrls"><div class="cbtn" onclick="prev()">⏮</div><div class="cbtn" id="play" onclick="toggle()">▶</div><div class="cbtn" onclick="next()">⏭</div></div>
      <div id="tools"><div class="tool" onclick="favOverlay(true)">♥</div><div class="tool" onclick="addDlCurrent()">⬇</div><div class="tool" onclick="go('queue')">☰</div><div class="tool" onclick="go('fx')">🎚</div></div>
      <div id="badges"><span class="badge" id="bsrc">—</span><span class="badge">320k</span></div>
      <div id="qanchor" onclick="go('queue')">正在播放 · 队列 <b id="qn">0</b> 首 ›</div>
    </div>
    <div id="content">
      <div class="page" id="pg-home"></div><div class="page" id="pg-explore"></div><div class="page" id="pg-boards"></div>
      <div class="page" id="pg-boarddetail"></div><div class="page" id="pg-podcast"></div><div class="page" id="pg-pcdetail"></div>
      <div class="page" id="pg-medialibs"></div><div class="page" id="pg-libadd"></div><div class="page" id="pg-libform"></div>
      <div class="page" id="pg-libdetail"></div><div class="page" id="pg-artist"></div><div class="page" id="pg-album"></div>
      <div class="page" id="pg-pldetail"></div><div class="page" id="pg-queue"></div><div class="page" id="pg-search"></div>
      <div class="page" id="pg-settings"></div><div class="page" id="pg-setdl"></div><div class="page" id="pg-setsrc"></div><div class="page" id="pg-setq"></div>
      <div class="page" id="pg-importpl"></div><div class="page" id="pg-server"></div><div class="page" id="pg-login"></div><div class="page" id="pg-fx"></div><div class="page" id="pg-about"></div><div class="page" id="pg-dlset"></div><div class="page" id="pg-tfsrc"></div><div class="page" id="pg-importsrc"></div><div class="page" id="pg-episode"></div><div class="page" id="pg-phone"></div>
    </div>
  </div>
  <div class="ov" id="fav"><div class="ovhead"><div class="back" onclick="favOverlay(false)">‹</div><b>我的收藏</b></div><div class="ovbody" id="favbody"></div></div>
  <div id="player">
    <div id="pbg"></div><div id="pveil"></div><div id="pback" onclick="closePlayer()">‹</div>
    <div id="pin">
      <div id="pinfo">
        <div id="pt">—</div>
        <div id="pa" onclick="artistSearch()">
          <svg width="16" height="16" viewBox="0 0 1024 1024" fill="rgba(179,179,184,.9)"><path d="M518.912 79.616a426.666667 426.666667 0 1 0 426.666667 426.666667 426.666667 426.666667 0 0 0-426.666667-426.666667z m0 640a213.333333 213.333333 0 1 1 213.333333-213.333333 213.333333 213.333333 0 0 1-213.333333 213.333333z"/><path d="M518.912 514.816m-85.333333 0a85.333333 85.333333 0 1 0 170.666666 0 85.333333 85.333333 0 1 0-170.666666 0Z"/><path d="M942.592 546.133333L687.786667 800.682667H518.144c-2.133333-12.288-8.533333-21.333333-16.298667-21.333334s-14.165333 9.045333-16.298666 21.333334h-17.834667v8.533333h17.066667c0 16.469333 7.68 29.866667 17.066666 29.866667s17.066667-13.397333 17.066667-29.866667H691.2l257.194667-257.28z"/></svg>
          <span id="paName">—</span>

 if(impStep===0){h+='<div class="sechead"><b>选择歌单所在平台</b></div><div class="grid">';var ks=Object.keys(IMPP);ks.forEach(function(k,i){var p=IMPP[k];h+='<div class="card" onclick="impPick(\''+k+'\')"><div class="cv" style="background:'+p.c+'"><div class="sq">'+p.n[0]+'</div></div><div class="nm">'+p.n+'</div><div class="ar">歌单链接导入</div></div>'});h+='</div>'}

 return h}

var page="home";

function render(){
 var ts=document.querySelectorAll(".tab");for(var i=0;i<ts.length;i++){ts[i].classList.toggle("on",ts[i].getAttribute("data-k")===page)}
 Object.keys(PAGES).forEach(function(k){
   var el=document.getElementById("pg-"+k);if(!el)return;
   el.classList.toggle("on",k===page);

     try{el.innerHTML=PAGES[k]();el.setAttribute("data-built","1")}

   }

}
function rebuild(p){var el=document.getElementById("pg-"+p);if(el){el.removeAttribute("data-built")}}

/* 播放引擎 */
function cur(){return songs[queue[qi]]||{n:"未在播放",a:"从首页选一首开始",al:"",d:0}}
function byId(id){return document.getElementById(id)}
function syncPanel(){var s=cur();var gi=queue.length?queue[qi]:0;
 byId("cover").style.background=grad(gi);byId("cover").textContent=s.n.slice(0,1);
 byId("pname").textContent=s.n;byId("partist").querySelector("span").textContent=s.a+" · "+s.al;
 byId("bsrc").textContent=qi%2?"酷我":"网易云";byId("qn").textContent=queue.length;
 byId("play").textContent=playing?"⏸":"▶";byId("play2").textContent=playing?"⏸":"▶";
 byId("vinyl").classList.toggle("spin",playing);
 byId("pt").textContent=s.n;byId("paName").textContent=s.a+" · "+s.al;
 if(byId("chipFav"))byId("chipFav").textContent=fav.indexOf(queue[qi])>=0?"♥":"♡";
 byId("vlab").style.background=grad(gi);byId("pbg").style.background=grad(gi);
 tickUI()}
function tickUI(){var s=cur();var pct=s.d>0?Math.min(100,pos/s.d*100):0;
 byId("t2").textContent=fmt(s.d);byId("t4").textContent=fmt(s.d);byId("t1").textContent=fmt(pos);byId("t3").textContent=fmt(pos);
 byId("pfill").style.width=pct+"%";byId("pfill2").style.width=pct+"%"}
function play(i){var at=queue.indexOf(i);if(at<0){queue.push(i);at=queue.length-1}qi=at;pos=0;playing=true;startTimer();rebuild("queue");render();syncPanel();toast("正在播放 · "+songs[i].n)}
function toggle(){playing=!playing;startTimer();syncPanel();render()}
function next(){qi=(qi+1)%queue.length;pos=0;rebuild("queue");render();syncPanel()}
function prev(){qi=(qi-1+queue.length)%queue.length;pos=0;rebuild("queue");render();syncPanel()}
function seekAt(e){var r=e.currentTarget.getBoundingClientRect();pos=Math.round(cur().d*(e.clientX-r.left)/r.width);tickUI()}
function startTimer(){clearInterval(timer);if(playing&&queue.length)timer=setInterval(function(){pos++;if(pos>=cur().d){next()}else tickUI()},1000)}
function artistSearch(){var a=cur().a;go("search");setTimeout(function(){var q=byId("sq");if(q){q.value=a;doSearch(a)}},60)}
function doSearch(w){var el=byId("sres");if(!el)return;if(!w||!w.trim()){el.innerHTML="";return}
 var q=w.trim().toLowerCase();var hit=songs.filter(function(s){return (s.n+s.a+s.al).toLowerCase().indexOf(q)>=0});
 var h='<div class="sechead"><b>"'+w+'" 的结果</b><span>五源聚合 '+(hit.length?'· '+hit.length+' 首':'')+'</span></div>'+(hit.map(function(s){return songRow(songs.indexOf(s))}).join("")||'');
 // 第三方媒体命中(按账号分区): 仅 emby/jellyfin/听风 有源内搜索(真机口径),接入后才出现
 var searchable=LIBS.filter(function(L){return ["emby","jellyfin","tingfeng"].indexOf(L.type)>=0});
 searchable.forEach(function(L){var t=TYPES[L.type];var ph=L.songsIdx.filter(function(i){return (songs[i].n+songs[i].a+songs[i].al).toLowerCase().indexOf(q)>=0});if(!ph.length)return;
  h+='<div class="sechead"><b>'+L.name+'</b><span style="color:'+t.c+'">'+t.n+' · 源内命中 '+ph.length+' 首</span></div>';
  ph.forEach(function(i){h+='<div class="srow" onclick="play('+i+')"><div class="cv" style="background:'+grad(i)+'"></div><div class="m"><b>'+songs[i].n+'</b><span>'+songs[i].a+' · '+songs[i].al+'</span></div><span style="font-size:10px;color:'+t.c+';border:1px solid '+t.c+'55;padding:1px 7px;border-radius:6px">'+t.n+'</span></div>'})});
 if(!hit.length&&!searchable.some(function(L){return L.songsIdx.some(function(i){return (songs[i].n+songs[i].a+songs[i].al).toLowerCase().indexOf(q)>=0})}))h+='<div style="color:#77777d;padding:20px 0">无结果</div>';
 el.innerHTML=h}
function searchForIdx(i){go("search");setTimeout(function(){var q=byId("sq");q.value=HOT[i];doSearch(HOT[i])},60)}
function openPlayer(){byId("player").classList.add("on")}

function favOverlay(on){byId("fav").classList.toggle("on",on);if(on){var b=byId("favbody");b.innerHTML=fav.length?fav.map(function(i){return songRow(i)}).join(""):'<div style="color:#77777d;padding:30px;text-align:center">还没有收藏</div>'}}

 else{var L={id:libSeq++,type:formType,name:byId("f_name").value.trim()||TYPES[formType].n+" 音源",host:host,user:byId("f_user").value.trim()||"user",

/* ---- 真行为函数 ---- */
var dlPaused=false,wifiOnly=true,parallel=2,fxOn=true,curEp=0,chipQv="无损",chipSpv="1.0×",chipSlv="关闭";
function addDlCurrent(){var i=queue[qi];if(DLQ.filter(function(d){return d.i===i}).length){toast("已在下载列表");go("setdl");return}DLQ.unshift({i:i,p:0});dlPaused=false;toast("已加入下载 · "+songs[i].n);go("setdl")}
