<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101516"><title>NextMusic CAR · 为我推荐</title><style>/* STYLES */</style></head><body>
<div id="app"><div id="shell" style="display:contents">
<header id="topbar"><a class="brand" href="#" onclick="event.preventDefault();go('home')" aria-label="NextMusic 首页" style="color:inherit;text-decoration:none"><img data-brand alt="">NextMusic <small>CAR</small></a><nav id="tabs" aria-label="主导航"></nav><div class="header-actions"><button class="header-action" id="voiceBtn" onclick="speechSearch()" aria-label="语音搜索"><span data-icon="mic"></span><span>语音</span></button><button class="header-action" onclick="go('search')" aria-label="搜索"><span data-icon="search"></span><span>搜索</span></button><button class="header-action icon-only" onclick="go('settings')" aria-label="设置"><span data-icon="settings"></span></button><time id="clock"></time></div></header>
<main id="main">
<aside id="panel" aria-label="常驻播放区">
<div class="nowhead"><span><i class="live-dot"></i>正在播放</span><span class="quality-tag" data-quality>SQ 无损</span></div>
<button class="cover-button" onclick="openPlayer()" aria-label="打开专注播放"><img data-art alt="场景概念封面"><span class="cover-expand" data-icon="expand"></span></button>
<div class="track-info"><h2 data-track-title>晴天</h2><button class="artist-link" data-artist onclick="artistSearch()" aria-label="搜索当前歌手">周杰伦 · 叶惠美</button></div>
<div class="timeline"><input type="range" class="seek" data-seek aria-label="播放进度" min="0" max="269" value="88" oninput="seekTo(this.value)"><div class="time-labels"><span data-elapsed>1:28</span><span data-duration>4:29</span></div></div>
<div class="transport"><button data-prev onclick="prev()" aria-label="上一首"><span data-icon="prev"></span></button><button class="play-primary" data-toggle onclick="toggle()" aria-label="播放"><span data-icon="play"></span></button><button data-next onclick="next()" aria-label="下一首"><span data-icon="next"></span></button></div>
<div class="panel-tools"><button data-fav onclick="toggleFavChip()" aria-pressed="false"><span data-icon="heart"></span><span>收藏</span></button><button onclick="openQueue()" aria-label="播放队列"><span data-icon="list"></span><span>队列</span></button><button onclick="openPlayer()" aria-label="专注播放"><span data-icon="expand"></span><span>专注</span></button></div>
<div class="next-up"><span data-icon="music"></span><span id="nextName">接下来 · 江南</span></div>
</aside><div id="content" aria-label="音乐内容"></div>
</main></div>
<section id="player" role="region" aria-label="专注播放"><div class="focus-ambient" id="focusAmbient"></div><header class="focus-header"><button id="focusBack" class="focus-back" onclick="closePlayer()"><span data-icon="back"></span>返回</button><span>专注播放</span><button class="icon-btn" onclick="openChooser('q')" aria-label="音质设置"><span data-quality>SQ 无损</span></button></header><div class="focus-grid"><img class="focus-art" data-art alt="场景概念封面"><div class="focus-info"><div class="eyebrow">NOW PLAYING / NEXTMUSIC</div><h1 data-track-title>晴天</h1><button class="artist-link" data-artist onclick="artistSearch()">周杰伦 · 叶惠美</button><div class="timeline"><input type="range" class="seek" data-seek min="0" max="269" value="88" aria-label="专注播放进度" oninput="seekTo(this.value)"><div class="time-labels"><span data-elapsed>1:28</span><span data-duration>4:29</span></div></div><div class="transport"><button data-prev onclick="prev()" aria-label="上一首"><span data-icon="prev"></span></button><button class="play-primary" data-toggle onclick="toggle()" aria-label="播放"><span data-icon="play"></span></button><button data-next onclick="next()" aria-label="下一首"><span data-icon="next"></span></button></div><div class="focus-tools"><button data-fav aria-pressed="false" onclick="toggleFavChip()"><span data-icon="heart"></span><span>收藏</span></button><button onclick="openQueue()"><span data-icon="list"></span>队列</button><button onclick="openPlayerOptions()" aria-label="更多播放设置"><span data-icon="more"></span></button></div></div></div><div class="focus-foot">只管向前，好音乐会一直在</div></section>
<div id="overlay"></div><div id="toast" role="status" aria-live="polite"></div></div>
<script>/* ART */</script><script>/* LEGACY */</script><script>/* APP */</script>
</body></html>
