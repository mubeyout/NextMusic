appId: com.mubeyworks.nextmusic.desktop
productName: NextMusic
directories: { output: release, buildResources: build }
icon: build/icon.png
# 主仓 desktop 形态:dist(renderer)+electron(主进程/驱动) 全部进包
files:
  - dist/**
  - electron/**
# 投屏运行时依赖(bonjour/castv2/airplay-sender/wasm 解码器)随生产 node_modules 自动进包;
# wasm 从 asar 外读更稳(fs 直读路径,不经 asar 虚拟层)
asarUnpack:
  - "**/*.wasm"
win:
  target: [nsis]
  signAndEditExecutable: true    # CI win 原生构建嵌 ico 进 exe(Linux 本地交叉打包时无 rcedit 需手动关)
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  target: [dmg]
  category: public.app-category.music
  identity: null               # 免签名(用户 xattr -cr)
  icon: build/icon.icns
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target: [AppImage, deb]
  category: Audio
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
