<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>NextMusic · 访问验证</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0b0c0f;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    overflow: hidden;
  }
  /* 背景光晕——与播放页氛围同源 */
  .glow { position: fixed; border-radius: 50%; filter: blur(120px); opacity: .5; pointer-events: none; }
  .glow.a { width: 480px; height: 480px; background: #1d4ed8; top: -180px; left: -120px; }
  .glow.b { width: 420px; height: 420px; background: #7c3aed; bottom: -160px; right: -100px; opacity: .35; }
  .card {
    position: relative; width: 100%; max-width: 380px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 20px;
    padding: 36px 28px 30px;
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
    text-align: center;
  }
  .logo { font-size: 40px; line-height: 1; margin-bottom: 14px; }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: .5px; margin-bottom: 6px; }
  .sub { font-size: 13px; color: rgba(255,255,255,.55); margin-bottom: 26px; }
  .field { position: relative; margin-bottom: 14px; }
  input {
    width: 100%; height: 48px;
    background: rgba(255,255,255,.07);
    border: 1.5px solid rgba(255,255,255,.14);
    border-radius: 12px;
    color: #fff; font-size: 16px;
    padding: 0 16px;
    outline: none;
    transition: border-color .18s, background .18s, box-shadow .18s;
  }
  input::placeholder { color: rgba(255,255,255,.35); }
  input:focus {
    border-color: #4f7cff;
    background: rgba(79,124,255,.08);
    box-shadow: 0 0 0 3px rgba(79,124,255,.22);
  }
  input[type=password].err { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.18); }
  button {
    width: 100%; height: 48px; margin-top: 6px;
    background: linear-gradient(135deg, #4f7cff, #7c5cff);
    border: none; border-radius: 12px;
    color: #fff; font-size: 16px; font-weight: 600; letter-spacing: 2px;
    cursor: pointer;
    transition: transform .12s, opacity .18s, box-shadow .18s;
    box-shadow: 0 8px 24px rgba(79,124,255,.35);
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .55; cursor: default; }
  .msg { height: 18px; font-size: 13px; color: #ef4444; margin-top: 12px; opacity: 0; transition: opacity .2s; }
  .msg.show { opacity: 1; }
  .foot { margin-top: 18px; font-size: 11px; color: rgba(255,255,255,.3); letter-spacing: 1px; }
</style>
</head>
<body>
<div class="glow a"></div><div class="glow b"></div>
<div class="card">
  <div class="logo">🎵</div>
  <h1>NextMusic</h1>
  <div class="sub">此服务器已开启访问验证</div>
  <div class="field">
    <input id="pw" type="password" placeholder="请输入访问密码" autocomplete="current-password" autofocus>
  </div>
  <button id="go">进入</button>
  <div class="msg" id="msg">密码不正确，请重试</div>
  <div class="foot">NEXTMUSIC · SELF-HOSTED</div>
</div>
<script>
(function () {
  var pw = document.getElementById('pw'), go = document.getElementById('go'), msg = document.getElementById('msg');
  function submit() {
    var v = pw.value.trim();
    if (!v) { pw.focus(); return; }
    go.disabled = true; go.textContent = '验证中…';
    // API 在根路径(不带 player 前缀);成功颁发 HttpOnly Cookie(lx_player_session, 7 天)
    fetch('/api/music/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: v })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.success) { location.replace(location.pathname || '/'); }
      else {
        pw.classList.add('err'); msg.classList.add('show');
        go.disabled = false; go.textContent = '进入';
        pw.select(); pw.focus();
      }
    }).catch(function () {
      msg.textContent = '网络异常，请重试'; msg.classList.add('show');
      go.disabled = false; go.textContent = '进入';
    });
  }
  go.addEventListener('click', submit);
  pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  pw.addEventListener('input', function () { pw.classList.remove('err'); msg.classList.remove('show'); });
})();
</script>
</body>
</html>
