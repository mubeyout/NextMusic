<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0d0f0e;
    background-image: radial-gradient(1200px 600px at 50% -10%, rgba(30,215,96,.08), transparent 60%),

    color: #fff;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 360px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px;
    padding: 40px 32px 32px;
    box-shadow: 0 24px 64px rgba(0,0,0,.5);
    text-align: center;
  }
  .logo { width: 64px; height: 64px; margin: 0 auto 16px; }
  .logo img { width: 100%; height: 100%; border-radius: 14px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  .sub { font-size: 13px; color: rgba(255,255,255,.5); margin: 8px 0 26px; }
  .field { position: relative; margin-bottom: 14px; text-align: left; }
  input {
    width: 100%; height: 46px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    color: #fff; font-size: 15px;
    padding: 0 16px;
    outline: none;
    transition: border-color .18s, background .18s;
  }
  input::placeholder { color: rgba(255,255,255,.3); }
  input:focus { border-color: rgba(30,215,96,.7); background: rgba(30,215,96,.06); }
  button {
    width: 100%; height: 46px;
    background: #1ED760; color: #06210f;
    border: none; border-radius: 12px;
    font-size: 15px; font-weight: 700; letter-spacing: 2px;
    cursor: pointer;
    transition: transform .12s, filter .18s;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .5; cursor: default; }
  .err {
    min-height: 20px; font-size: 13px; color: #ff6b6b;
    margin: 10px 0 2px; text-align: center;
  }
  .foot { margin-top: 18px; font-size: 11px; color: rgba(255,255,255,.25); letter-spacing: 1px; }

    <h1>NextMusic</h1>
    <div class="sub">私人音乐空间 · 请输入访问密码</div>
    <div class="field">
      <input id="pwd" type="password" placeholder="访问密码" autocomplete="current-password" autofocus>
    </div>
    <button id="go">进 入</button>
    <div class="err" id="err"></div>
    <div class="foot">NextMusic</div>
  </div>
<script>
  var pwd = document.getElementById('pwd'), go = document.getElementById('go'), err = document.getElementById('err');
  var busy = false;
  function submit() {
    if (busy) return;
    var v = pwd.value.trim();
    if (!v) { pwd.focus(); return; }
    busy = true; go.disabled = true; go.textContent = '验证中…'; err.textContent = '';
    fetch('/api/music/auth', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password: v })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.success) {
        go.textContent = '✓ 已解锁';
        location.replace('/');
        return;
      }
      err.textContent = '密码不正确，再试一次';
      pwd.select();
      busy = false; go.disabled = false; go.textContent = '进 入';
    }).catch(function (e) {
      err.textContent = '网络异常：' + (e && e.message ? e.message : '请重试');
      busy = false; go.disabled = false; go.textContent = '进 入';
    });
  }
  go.addEventListener('click', submit);
  pwd.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
</script>
